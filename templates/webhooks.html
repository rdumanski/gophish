{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <h1 class="page-header">
        {{.Title}}
    </h1>
    <div id="flashes" class="row"></div>
    <div class="row">
        <button type="button" class="btn btn-primary" id="new_button" data-toggle="modal" data-backdrop="static"
            data-webhook-id="-1" data-target="#modal">
            <i class="fa fa-plus"></i> {{ .T "webhooks.new" }}</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div class="row">
        <table id="webhookTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th class="col-md-2 no-sort">{{ .T "webhooks.col_title" }}</th>
                    <th class="col-md-2 no-sort">{{ .T "webhooks.col_url" }}</th>
                    <th class="col-md-2 no-">{{ .T "webhooks.col_active" }}</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="webhookModalLabel">{{ .T "webhooks.modal_title" }}</h4>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="title">{{ .T "webhooks.name_label" }}</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="{{ .T "common.name" }}" id="name" required autofocus />
                </div>

                <label class="control-label" for="url">{{ .T "webhooks.url_label" }}</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="https://example.com/webhook1" id="url" required />
                </div>

                <label class="control-label" for="secret">{{ .T "webhooks.secret_label" }}</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="{{ .T "webhooks.secret_placeholder" }}" id="secret" required />
                </div>

                <div class="checkbox checkbox-primary">
                    <input type="checkbox" id="is_active" value="true" />
                    <label for="is_active">{{ .T "webhooks.is_active" }} <i class="fa fa-question-circle"
                            data-toggle="tooltip" data-placement="right"
                            title="{{ .T "webhooks.is_active_tooltip" }}"></i>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">{{ .T "common.close" }}</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">{{ .T "webhooks.save_changes" }}</button>
            </div>
        </div>
    </div>
</div>


{{end}} {{define "scripts"}}
<script src="/js/dist/app/webhooks.min.js"></script>
{{end}}
